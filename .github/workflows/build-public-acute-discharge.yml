name: Build public acute discharge data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-public-acute-discharge.yml"
      - "scripts/build_acute_discharge_2024_25.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-public-acute-discharge
  cancel-in-progress: true

jobs:
  build-acute-discharge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests openpyxl

      - name: 04. Build and validate annual acute discharge data
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee public-data/acute-discharge-build-log.txt
          import pandas as pd
          import runpy

          # pandas 3 removed DataFrame.applymap; retain compatibility with the
          # explicitly element-wise conversion used by the published-data build.
          if not hasattr(pd.DataFrame,"applymap"):
              pd.DataFrame.applymap = lambda self,function: self.map(function)

          runpy.run_path("scripts/build_acute_discharge_2024_25.py",run_name="__main__")
          PY

      - name: 05. Commit generated data or diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/acute-discharge-build-log.txt
          if [ -f public-data/acute-discharge-2024-25.json ]; then git add public-data/acute-discharge-2024-25.json; fi

          if git diff --cached --quiet; then
            echo "No acute discharge changes to commit."
          else
            git commit -m "Record acute discharge 2024-25 build result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 06. Fail after preserving diagnostics
        if: steps.build.outcome == 'failure'
        run: exit 1
