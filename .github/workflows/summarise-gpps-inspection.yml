name: Summarise GP Patient Survey inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/summarise-gpps-inspection.yml"
      - "scripts/summarise_gpps_inspection.py"
      - "public-data/gpps-2025-inspection.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarise-gpps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Build compact inspection summary
        run: python scripts/summarise_gpps_inspection.py

      - name: 04. Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/gpps-2025-inspection-summary.json

          if git diff --cached --quiet; then
            echo "No GPPS inspection summary changes to commit."
          else
            git commit -m "Summarise GP Patient Survey 2025 inspection"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
