name: Inspect GP Patient Survey reporting variables

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-gpps-variables.yml"
      - "scripts/inspect_gpps_variables_2025.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspect-gpps-variables
  cancel-in-progress: true

jobs:
  inspect-gpps-variables:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests openpyxl

      - name: 04. Inspect variables and candidate measures
        run: python scripts/inspect_gpps_variables_2025.py

      - name: 05. Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/gpps-2025-variable-inspection.json

          if git diff --cached --quiet; then
            echo "No GPPS variable inspection changes to commit."
          else
            git commit -m "Generate GP Patient Survey 2025 variable inspection"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
