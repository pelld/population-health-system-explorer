name: Summarise bed occupancy data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/summarise-bed-occupancy.yml"
      - "scripts/summarise_bed_occupancy.py"
      - "public-data/bed-occupancy-2024-25.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create summary
        run: python scripts/summarise_bed_occupancy.py
      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/bed-occupancy-2024-25-summary.json
          if git diff --cached --quiet; then
            echo "No summary changes."
          else
            git commit -m "Generate bed occupancy validation summary"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
