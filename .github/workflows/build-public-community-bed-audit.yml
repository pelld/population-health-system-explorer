name: Build public community bed audit data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-public-community-bed-audit.yml"
      - "scripts/build_community_bed_audit_2026.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-public-community-bed-audit
  cancel-in-progress: true

jobs:
  build-community-bed-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade requests openpyxl

      - name: 04. Build validated audit data
        run: python scripts/build_community_bed_audit_2026.py

      - name: 05. Commit generated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/community-bed-audit-2026.json

          if git diff --cached --quiet; then
            echo "No community-bed-audit changes to commit."
          else
            git commit -m "Generate public community bed audit data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
