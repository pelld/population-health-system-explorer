name: Inspect public community waiting-list workbook

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-public-chs-waits.yml"
      - "scripts/inspect_chs_waits_2024_25.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspect-public-chs-waits
  cancel-in-progress: true

jobs:
  inspect-chs-waits:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade requests openpyxl

      - name: 04. Inspect the March 2025 workbook
        run: python scripts/inspect_chs_waits_2024_25.py

      - name: 05. Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/chs-waits-workbook-inspection.json

          if git diff --cached --quiet; then
            echo "No inspection changes to commit."
          else
            git commit -m "Generate community waiting-list inspection data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
