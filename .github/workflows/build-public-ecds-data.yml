name: Build public ECDS data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-public-ecds-data.yml"
      - "scripts/inspect_public_ecds.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-public-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas openpyxl requests

      - name: 04. Download and inspect public ECDS files
        run: python scripts/inspect_public_ecds.py

      - name: 05. Commit generated inspection data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public-data
          if git diff --cached --quiet; then
            echo "No public-data changes to commit."
          else
            git commit -m "Generate public ECDS inspection data"
            git push
          fi
