name: Build public ECDS provider data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-public-ecds-data.yml"
      - "scripts/build_provider_routes.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-provider-routes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests

      - name: 04. Build provider-level route metrics
        run: python scripts/build_provider_routes.py

      - name: 05. Commit generated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/ecds-2024-25-provider-routes.json
          if git diff --cached --quiet; then
            echo "No provider-data changes to commit."
          else
            git commit -m "Generate public ECDS provider route data"
            git push
          fi
