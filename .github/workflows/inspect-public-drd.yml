name: Inspect public discharge ready date data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-public-drd.yml"
      - "scripts/inspect_drd_2024_25.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspect-public-drd
  cancel-in-progress: true

jobs:
  inspect-drd:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests

      - name: 04. Inspect revised monthly CSV files
        run: python scripts/inspect_drd_2024_25.py

      - name: 05. Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/drd-2024-25-inspection.json

          if git diff --cached --quiet; then
            echo "No discharge ready date inspection changes to commit."
          else
            git commit -m "Generate discharge ready date 2024-25 inspection data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
