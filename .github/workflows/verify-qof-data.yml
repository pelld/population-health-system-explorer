name: Verify all QOF totals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-qof-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-qof-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Run complete QOF reconciliation
        run: python scripts/validate_qof_2024_25.py | tee public-data/qof-data-validation.txt

      - name: 03. Record successful validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/qof-data-validation.txt
          git commit -m "Validate all QOF totals"
          git pull --rebase origin main
          git push origin HEAD:main
