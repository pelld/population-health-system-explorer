name: Profile selected GP Patient Survey measures

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-gpps-selected.yml"
      - "scripts/profile_gpps_selected_2025.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-gpps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests

      - name: 04. Profile selected summary fields
        run: python scripts/profile_gpps_selected_2025.py

      - name: 05. Commit profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/gpps-2025-selected-profile.json

          if git diff --cached --quiet; then
            echo "No selected GPPS profile changes to commit."
          else
            git commit -m "Profile selected GP Patient Survey 2025 measures"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
