name: Build public community waiting-list data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-public-community-waits.yml"
      - "scripts/build_community_waits_2024_25.py"
      - "scripts/run_community_waits_2024_25.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-public-community-waits
  cancel-in-progress: true

jobs:
  build-community-waits:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests openpyxl

      - name: 04. Build March stock and preserve diagnostics
        run: |
          mkdir -p public-data
          set +e
          python scripts/run_community_waits_2024_25.py > public-data/community-waits-build-log.txt 2>&1
          status=$?
          cat public-data/community-waits-build-log.txt
          echo "exit_status=${status}" >> public-data/community-waits-build-log.txt
          exit 0

      - name: 05. Commit generated data or diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/community-waits-build-log.txt

          if [ -f public-data/community-waits-2024-25.json ]; then
            git add public-data/community-waits-2024-25.json
          fi

          if git diff --cached --quiet; then
            echo "No community-waiting-list changes to commit."
          else
            git commit -m "Generate community waiting-list build output"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
