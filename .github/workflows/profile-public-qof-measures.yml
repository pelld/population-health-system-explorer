name: Profile public QOF measures

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-public-qof-measures.yml"
      - "scripts/profile_qof_measures_2024_25.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-qof-measures:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade requests

      - name: 04. Profile exact achievement measures
        run: python scripts/profile_qof_measures_2024_25.py

      - name: 05. Commit measure profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/qof-2024-25-measure-profile.json

          if git diff --cached --quiet; then
            echo "No QOF measure profile changes to commit."
          else
            git commit -m "Generate QOF 2024-25 measure profile"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
