name: Summarise public QOF national data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/summarise-public-qof-national.yml"
      - "scripts/summarise_qof_national_2024_25.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarise-qof-national:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests openpyxl

      - name: 04. Extract direct England rows
        run: python scripts/summarise_qof_national_2024_25.py

      - name: 05. Commit national reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/qof-2024-25-national-reference.json

          if git diff --cached --quiet; then
            echo "No QOF national reference changes to commit."
          else
            git commit -m "Generate QOF 2024-25 national reference"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
