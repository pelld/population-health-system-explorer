name: Inspect QOF practice achievement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-public-qof-practice-achievement.yml"
      - "scripts/inspect_qof_practice_achievement.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-qof-practice-achievement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests openpyxl

      - name: 04. Inspect official practice achievement workbook
        run: python scripts/inspect_qof_practice_achievement.py

      - name: 05. Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/qof-2024-25-practice-achievement-inspection.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Generate QOF practice achievement inspection"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
