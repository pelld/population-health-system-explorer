name: Inspect public IUC ADC data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-public-iucadc.yml"
      - "scripts/inspect_iucadc.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspect-public-iucadc
  cancel-in-progress: true

jobs:
  inspect-iucadc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade requests

      - name: 04. Inspect revised IUC ADC CSV
        run: python scripts/inspect_iucadc.py

      - name: 05. Commit inspection files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/inspection/iucadc-structure.json public-data/inspection/iucadc-sample.csv

          if git diff --cached --quiet; then
            echo "No inspection changes to commit."
          else
            git commit -m "Generate public IUC ADC inspection data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
