name: Build public NHS 111 IUC pathway data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-public-iucadc.yml"
      - "scripts/build_iucadc_2024_25.py"
      - "scripts/finalise_iucadc_2024_25.py"
      - "scripts/complete_iucadc_breakdowns.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-public-iucadc
  cancel-in-progress: true

jobs:
  build-iucadc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests

      - name: 04. Build contract-area pathway data
        run: python scripts/build_iucadc_2024_25.py

      - name: 05. Apply revised published England totals
        run: python scripts/finalise_iucadc_2024_25.py

      - name: 06. Reconcile booking breakdowns
        run: python scripts/complete_iucadc_breakdowns.py

      - name: 07. Commit generated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/iucadc-2024-25.json

          if git diff --cached --quiet; then
            echo "No IUC-data changes to commit."
          else
            git commit -m "Generate public NHS 111 IUC pathway data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
