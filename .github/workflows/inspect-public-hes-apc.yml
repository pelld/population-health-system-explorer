name: Inspect public HES APC data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-public-hes-apc.yml"
      - "scripts/inspect_hes_apc_2024_25.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspect-public-hes-apc
  cancel-in-progress: true

jobs:
  inspect-hes-apc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests openpyxl

      - name: 04. Inspect final annual public files
        run: python scripts/inspect_hes_apc_2024_25.py

      - name: 05. Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add public-data/hes-apc-2024-25-inspection.json

          if git diff --cached --quiet; then
            echo "No HES APC inspection changes to commit."
          else
            git commit -m "Generate HES APC 2024-25 inspection data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
