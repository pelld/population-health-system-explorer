name: Build public GP Patient Survey data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-public-gpps.yml"
      - "scripts/build_gpps_2025.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-public-gpps
  cancel-in-progress: true

jobs:
  build-gpps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests

      - name: 04. Build and hard validate GPPS data
        run: python scripts/build_gpps_2025.py

      - name: 05. Commit generated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/gpps-2025.json public-data/gpps-2025-practices.json

          if git diff --cached --quiet; then
            echo "No GPPS data changes to commit."
          else
            git commit -m "Generate public GP Patient Survey 2025 data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
