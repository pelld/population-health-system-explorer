name: Build public GP Patient Survey data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-public-gpps.yml"
      - "scripts/build_gpps_2025.py"
      - "scripts/run_build_gpps_2025.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-public-gpps
  cancel-in-progress: true

jobs:
  build-gpps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests

      - name: 04. Validate raw source and build GPPS data
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/run_build_gpps_2025.py 2>&1 | tee public-data/gpps-build-log.txt

      - name: 05. Commit generated data or diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/gpps-build-log.txt
          if [ -f public-data/gpps-2025.json ]; then git add public-data/gpps-2025.json; fi
          if [ -f public-data/gpps-2025-practices.json ]; then git add public-data/gpps-2025-practices.json; fi

          if git diff --cached --quiet; then
            echo "No GPPS changes to commit."
          else
            git commit -m "Record GP Patient Survey 2025 build result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 06. Fail after preserving diagnostics
        if: steps.build.outcome == 'failure'
        run: exit 1
