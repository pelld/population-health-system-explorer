name: Verify QOF JavaScript

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-qof-javascript.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-qof-javascript:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Check QOF JavaScript syntax
        run: |
          node --check qof-sources.js
          node --check qof-map-data.js
          node --check qof-metrics.js
          node --check qof-metrics-fixes.js
          node --check operational-pathway-selection.js

      - name: 03. Record successful validation
        run: |
          echo "QOF JavaScript syntax validated." > public-data/qof-javascript-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/qof-javascript-validation.txt
          git commit -m "Validate QOF JavaScript"
          git pull --rebase origin main
          git push origin HEAD:main
