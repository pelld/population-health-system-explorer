name: Check pathway JavaScript

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-pathway-javascript.yml"
      - "operational-pathway-selection.js"
      - "ambulance-metrics.js"
      - "iuc-metrics.js"
      - "gpad-metrics.js"
      - "ucr-map-data.js"
      - "ucr-metrics.js"
      - "community-waits-sources.js"
      - "community-waits-map-data.js"
      - "community-waits-metrics.js"
      - "community-waits-metrics-fixes.js"
      - "csds-sources.js"
      - "csds-map-data.js"
      - "csds-metrics.js"
      - "community-bed-sources.js"
      - "community-bed-map-data.js"
      - "community-bed-metrics.js"
      - "hes-apc-sources.js"
      - "hes-apc-map-data.js"
      - "hes-apc-metrics.js"
      - "bed-occupancy-sources.js"
      - "bed-occupancy-map-data.js"
      - "bed-occupancy-metrics.js"
      - "acute-discharge-sources.js"
      - "acute-discharge-map-data.js"
      - "acute-discharge-metrics.js"
      - "drd-sources.js"
      - "drd-map-data.js"
      - "drd-metrics.js"
      - "gpps-sources.js"
      - "gpps-map-data.js"
      - "gpps-metrics.js"
      - "qof-sources.js"
      - "qof-map-data.js"
      - "qof-metrics.js"

jobs:
  check-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4

      - name: 02. Check JavaScript syntax
        run: |
          node --check operational-pathway-selection.js
          node --check ambulance-metrics.js
          node --check iuc-metrics.js
          node --check gpad-metrics.js
          node --check ucr-map-data.js
          node --check ucr-metrics.js
          node --check community-waits-sources.js
          node --check community-waits-map-data.js
          node --check community-waits-metrics.js
          node --check community-waits-metrics-fixes.js
          node --check csds-sources.js
          node --check csds-map-data.js
          node --check csds-metrics.js
          node --check community-bed-sources.js
          node --check community-bed-map-data.js
          node --check community-bed-metrics.js
          node --check hes-apc-sources.js
          node --check hes-apc-map-data.js
          node --check hes-apc-metrics.js
          node --check bed-occupancy-sources.js
          node --check bed-occupancy-map-data.js
          node --check bed-occupancy-metrics.js
          node --check acute-discharge-sources.js
          node --check acute-discharge-map-data.js
          node --check acute-discharge-metrics.js
          node --check drd-sources.js
          node --check drd-map-data.js
          node --check drd-metrics.js
          node --check gpps-sources.js
          node --check gpps-map-data.js
          node --check gpps-metrics.js
          node --check qof-sources.js
          node --check qof-map-data.js
          node --check qof-metrics.js
