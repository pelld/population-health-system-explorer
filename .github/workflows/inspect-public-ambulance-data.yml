name: Inspect public ambulance AQI data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-public-ambulance-data.yml"
      - "scripts/inspect_ambulance_aqi.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspect-public-ambulance-aqi
  cancel-in-progress: true

jobs:
  inspect-ambulance-aqi:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests

      - name: 04. Inspect official AmbSYS CSV
        run: python scripts/inspect_ambulance_aqi.py

      - name: 05. Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/ambulance-aqi-inspection.json

          if git diff --cached --quiet; then
            echo "No inspection changes to commit."
          else
            git commit -m "Generate ambulance AQI inspection data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
