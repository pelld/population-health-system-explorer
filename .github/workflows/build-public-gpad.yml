name: Build public GPAD ICB pathway data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-public-gpad.yml"
      - "scripts/build_gpad_2024_25.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-public-gpad
  cancel-in-progress: true

jobs:
  build-gpad:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 01. Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 02. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 03. Install dependencies
        run: python -m pip install --upgrade pandas requests

      - name: 04. Build 2024-25 ICB profile
        run: python scripts/build_gpad_2024_25.py

      - name: 05. Commit generated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/gpad-2024-25-icb.json

          if git diff --cached --quiet; then
            echo "No GPAD-data changes to commit."
          else
            git commit -m "Generate public GPAD ICB pathway data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
